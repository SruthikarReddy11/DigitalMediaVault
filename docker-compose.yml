version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdl_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: personal_library
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdl_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:SecretPassword123!@postgres:5432/personal_library?schema=public
      SESSION_SECRET: production-super-secret-key-change-this-min32chars
      CORS_ORIGIN: http://localhost:5173
      STORAGE_TYPE: postgres
    depends_on:
      - postgres

volumes:
  pgdata:
